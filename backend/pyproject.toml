[project]
name = "buildiq-backend"
version = "0.1.0"
description = "BuildIQ FastAPI backend kernel scaffold."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.139,<1.0",
    "PyJWT>=2.8,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.4,<3.0",
    "pillow>=12.2.0,<13.0",
    "python-dotenv>=1.2.2,<2.0",
    "reportlab>=4.5.1,<5.0",
    "SQLAlchemy>=2.0,<3.0",
    "starlette>=1.3.1,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=9.0.3,<10.0",
]

[project.scripts]
buildiq-seed-dev = "app.seeds.dev:main"
buildiq-export-openapi = "app.scripts.export_openapi:main"

[build-system]
requires = ["setuptools>=78.1.1", "wheel>=0.46"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
