name: Feature request
description: Propose a bounded product or engineering improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the verified workflow problem without customer or confidential information.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Architecture and security boundaries
      description: Note tenancy, permissions, financial, storage, or operational constraints.
    validations:
      required: true
